method: PUT
body:
  type: json
  content: "{\r

    \  \"name\": \"Владикавказ обновлённый\",\r

    \  \"population\": 325000,\r

    \  \"country\": \"Россия\",\r

    \  \"area\": 295\r

    }"
scripts:
