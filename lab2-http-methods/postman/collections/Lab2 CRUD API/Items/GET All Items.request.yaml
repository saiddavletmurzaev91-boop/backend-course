$kind: http-request
url: "{{base_url}}/items"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Статус 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Ответ в формате JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Есть поле count\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.have.property('count');\r

      });\r

      \r

      pm.test(\"items - это массив\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData.items).to.be.an('array');\r

      });"
    language: text/javascript
order: 1789513013762
